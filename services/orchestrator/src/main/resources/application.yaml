server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ougsi}?currentSchema=orchestrator
    username: ${ORCHESTRATOR_DB_USER:orchestrator}
    password: ${ORCHESTRATOR_DB_PASSWORD}
  flyway:
    default-schema: orchestrator
    create-schemas: false
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    read:
      strict-duplicate-detection: true

management:
  endpoints:
    web:
      exposure:
        include: health
