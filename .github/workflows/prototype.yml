name: Prototype build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example up --detach --wait
      - name: Verify service startup and request persistence
        shell: bash
        run: |
          set -a
          source .env.example
          set +a
          java -jar services/vm-service/target/vm-service-0.1.0-SNAPSHOT.jar > vm-service.log 2>&1 &
          vm_pid=$!
          orchestrator_pid=
          trap 'kill "$vm_pid" ${orchestrator_pid:+"$orchestrator_pid"} 2>/dev/null || true' EXIT
          start_orchestrator() {
            java -jar services/orchestrator/target/orchestrator-0.1.0-SNAPSHOT.jar >> orchestrator.log 2>&1 &
            orchestrator_pid=$!
            curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
              --max-time 3 http://127.0.0.1:8080/actuator/health
          }
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            --max-time 3 http://127.0.0.1:8081/actuator/health
          start_orchestrator
          base_url=http://127.0.0.1:8080
          request='{"nodeId":"14c48a31-e5a4-491b-8f96-6a82876afa95","imageId":"6b7cda20-f659-479c-b30f-fb3913da97b6","name":"demo-guest","vcpus":2,"memoryMiB":2048,"diskGiB":20,"network":"default"}'
          status=$(curl --fail --silent --show-error --max-time 5 --header 'Content-Type: application/json' \
            --data "$request" --output request.json --write-out '%{http_code}' "$base_url/api/v1/requests")
          test "$status" = 202
          request_id=$(jq -er 'select(.status == "QUEUED") | .requestId' request.json)
          kill "$orchestrator_pid"
          wait "$orchestrator_pid" || true
          orchestrator_pid=
          start_orchestrator
          curl --fail --silent --show-error --max-time 5 "$base_url/api/v1/requests/$request_id" \
            | jq --exit-status --slurpfile before request.json '. == $before[0]'
      - if: failure()
        run: |
          docker compose --env-file .env.example logs
          for log in orchestrator.log vm-service.log; do
            if test -f "$log"; then cat "$log"; fi
          done
      - if: always()
        run: docker compose --env-file .env.example down --volumes

  node-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S node-agent -B .build/node-agent -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .build/node-agent --parallel
      - run: ctest --test-dir .build/node-agent --output-on-failure

  windows-hyperv:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build windows/hyperv/src -c Release
      - run: dotnet run --project windows/hyperv/tests -c Release
      - name: Test the Hyper-V cmdlet integration with mocks
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File windows/hyperv/tests/HyperV.Tests.ps1
